# Tema visual nativo de Streamlit -- sin CSS/HTML propio, respeta la
# convención del proyecto ("100% Python, sin HTML/JS/CSS"). Rama
# `gamificacion`: paleta cálida y tranquila (terracota + beige), más
# cerca del tono "calma" de apps de bienestar (Headspace/Fabulous) que
# el rojo/gris default de Streamlit. Ver ui/Dockerfile -- esta carpeta
# se copia a la imagen para que aplique también en producción, no solo
# en desarrollo local.
[theme]
base = "light"
primaryColor = "#E08E6D"
backgroundColor = "#FFFBF7"
secondaryBackgroundColor = "#F5EDE4"
textColor = "#3D3229"
font = "sans serif"

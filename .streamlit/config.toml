# Tema visual nativo de Streamlit -- sin CSS/HTML propio, respeta la
# convención del proyecto ("100% Python, sin HTML/JS/CSS"). Rama
# `gamificacion`: navy noche + dorado, derivada del logo real de Telos
# (cielo nocturno, anillos dorados, un camino hacia el horizonte) --
# reemplaza la terracota/beige anterior a pedido explícito del dueño del
# producto; mismos valores que web/src/app/globals.css, para que las dos
# interfaces se vean como el mismo producto. Ver ui/Dockerfile -- esta
# carpeta se copia a la imagen para que aplique también en producción,
# no solo en desarrollo local.
[theme]
base = "dark"
primaryColor = "#D9B26A"
backgroundColor = "#14142B"
secondaryBackgroundColor = "#242452"
textColor = "#F2E8D5"
font = "sans serif"
